name: BotW
options:
  bundleIdPrefix: dev.botw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # macos-14 runners ship Xcode 15.x; newer XcodeGen defaults to the Xcode 16 project
  # format (objectVersion 77) which Xcode 15 refuses to open.
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  BotW:
    type: application
    platform: iOS
    sources:
      - path: BotW
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.botw.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: BotW
schemes:
  BotW:
    build:
      targets:
        BotW: all
    run:
      config: Debug
