name: tpidrro probe

on:
  push:
    branches: [ probe/tpidrro ]
  workflow_dispatch:

jobs:
  probe-sigill:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: expects SIGILL on msr tpidrro_el0
        run: bash scripts/ci/tpidrro_probe.sh sigill
  probe-changed:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: expects the write to take effect
        run: bash scripts/ci/tpidrro_probe.sh changed
  probe-ignored:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: expects the write to be ignored
        run: bash scripts/ci/tpidrro_probe.sh ignored
