name: ios-build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # Everything that can be checked without a Mac.  If this job is red there is
  # no point paying for a macOS runner.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generated NVN artefacts are up to date
        run: python scripts/gen_nvn.py --repo . --check

      - name: NVN argument shapes are consistent
        run: python scripts/extract_nvn_signatures.py --check
      - name: Shader generator produces C tables and file bundles
        run: python scripts/shader_chain/test_gen_blobs.py
      - name: Repository invariants (registry / bindings / no title data)
        run: python scripts/verify_ios.py

      - name: Coverage progress (log only)
        run: python scripts/nvn_status.py

      - name: Release gate is still closed (expected to fail on purpose)
        run: |
          if python scripts/verify_ios.py --release; then
            echo "::error::verify_ios --release passed but kEnumsVerified is still 0"
            exit 1
          fi
          echo "release gate correctly refuses to pass"

      - name: Build + run the portable tests (clang)
        run: |
          set -euo pipefail
          INC="-I core/include -I ios/nvn/include"
          FLAGS="-std=c++20 -Wall -Wextra -Werror -O1"
          # nvn_texture.c is plain C: compile it as C so the header's extern "C"
          # is exercised, then link the result into every test.
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_texture.c -o /tmp/nvn_texture.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_shader.c  -o /tmp/nvn_shader.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_shader_key.c -o /tmp/nvn_shader_key.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_shader_bundle.c -o /tmp/nvn_shader_bundle.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_shader_blobs.gen.c -o /tmp/nvn_shader_blobs.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_vertex.c -o /tmp/nvn_vertex.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_pool.c -o /tmp/nvn_pool.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_sampler.c -o /tmp/nvn_sampler.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_texlayout.c -o /tmp/nvn_texlayout.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_bcn.c -o /tmp/nvn_bcn.o
          clang -std=c11 -Wall -Wextra -Werror $INC -c ios/nvn/src/nvn_state.c -o /tmp/nvn_state.o
          LIB="ios/nvn/src/nvn_dispatch.cpp ios/nvn/src/nvn_null.cpp core/src/botw_core.cpp /tmp/nvn_texture.o /tmp/nvn_shader.o /tmp/nvn_shader_key.o /tmp/nvn_shader_bundle.o /tmp/nvn_shader_blobs.o /tmp/nvn_vertex.o /tmp/nvn_sampler.o /tmp/nvn_pool.o /tmp/nvn_texlayout.o /tmp/nvn_bcn.o /tmp/nvn_state.o"
          clang++ $FLAGS $INC tests/nvn_abi_test.cpp      $LIB -o /tmp/nvn_abi_test
          clang++ $FLAGS $INC tests/core_smoke_test.cpp   $LIB -o /tmp/core_smoke_test
          clang++ $FLAGS $INC tests/nvn_texture_test.cpp  $LIB -o /tmp/nvn_texture_test
          clang++ $FLAGS $INC tests/nvn_shader_test.cpp   $LIB -o /tmp/nvn_shader_test
          clang++ $FLAGS $INC tests/nvn_vertex_test.cpp   $LIB -o /tmp/nvn_vertex_test
          clang++ $FLAGS $INC tests/nvn_sampler_test.cpp  $LIB -o /tmp/nvn_sampler_test
          clang++ $FLAGS $INC tests/nvn_pool_test.cpp     $LIB -o /tmp/nvn_pool_test
          clang++ $FLAGS $INC tests/nvn_texlayout_test.cpp $LIB -o /tmp/nvn_texlayout_test
          clang++ $FLAGS $INC tests/nvn_shader_bundle_test.cpp $LIB -o /tmp/nvn_shader_bundle_test
          clang++ $FLAGS $INC tests/nvn_bcn_test.cpp $LIB -o /tmp/nvn_bcn_test
          clang++ $FLAGS $INC tests/nvn_state_test.cpp $LIB -o /tmp/nvn_state_test
          /tmp/nvn_abi_test
          /tmp/core_smoke_test
          /tmp/nvn_texture_test
          /tmp/nvn_shader_test
          /tmp/nvn_vertex_test
          /tmp/nvn_sampler_test
          /tmp/nvn_pool_test
          /tmp/nvn_texlayout_test
          /tmp/nvn_bcn_test
          /tmp/nvn_shader_bundle_test
          /tmp/nvn_state_test

      # nvn_metal.mm is ObjC++; this parses it against tests/stubs/ so a type
      # error in the Metal backend is caught without a mac runner.
      - name: Metal backend type-checks (clang + stub headers)
        run: python scripts/syntax_check_metal.py --require

      - name: C ABI compiles on its own (header hygiene)
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror -I core/include -I ios/nvn/include \
            -fsyntax-only core/src/botw_core.cpp
          clang -std=c11 -Wall -Wextra -Werror -I ios/nvn/include \
            -fsyntax-only ios/nvn/include/nvn_api.h
          clang -std=c11 -Wall -Wextra -Werror -I ios/nvn/include \
            -fsyntax-only ios/nvn/include/nvn_texture.h
          clang -std=c11 -Wall -Wextra -Werror -I ios/nvn/include \
            -fsyntax-only ios/nvn/include/nvn_shader.h
          clang -std=c11 -Wall -Wextra -Werror -I ios/nvn/include \
            -fsyntax-only ios/nvn/include/nvn_state.h
          clang -std=c11 -Wall -Wextra -Werror -I ios/nvn/include \
            -fsyntax-only ios/nvn/include/nvn_vertex.h
          clang -std=c11 -Wall -Wextra -Werror -I ios/nvn/include \
            -fsyntax-only ios/nvn/include/nvn_sampler.h
          clang -std=c11 -Wall -Wextra -Werror -I ios/nvn/include \
            -fsyntax-only ios/nvn/include/nvn_pool.h
          # The keycheck tool is built by hand against a game; at least keep it
          # compiling here so it cannot rot.
          clang++ -std=c++20 -Wall -Wextra -Werror -I ios/nvn/include \
            -fsyntax-only scripts/shader_chain/keycheck.cpp

  ios:
    needs: portable
    # XcodeGen 2.44+ emits objectVersion 77 (Xcode 16 format); macos-14 only has Xcode 15.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify generated project parses
        working-directory: ios
        run: |
          xcodegen --version
          echo "objectVersion: $(grep -m1 objectVersion BotW.xcodeproj/project.pbxproj || echo missing)"
          ls -la BotW.xcodeproj
          if ! out=$(xcodebuild -list -project BotW.xcodeproj 2>&1); then
            echo "$out" | head -20 | while read -r line; do echo "::error::$line"; done
            echo "::error::plutil: $(plutil -lint BotW.xcodeproj/project.pbxproj 2>&1 | head -3)"
            head -12 BotW.xcodeproj/project.pbxproj | while read -r line; do echo "::error::pbxproj| $line"; done
            exit 1
          fi
          echo "$out" | head -12

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BotW.xcodeproj -scheme BotW \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build-sim.log 2>&1 || rc=$?
          if [ -n "${rc:-}" ]; then
            grep -E "(error|fatal error):" build-sim.log | head -25 | while read -r line; do
              echo "::error::$line"
            done
            echo "::error::xcodebuild exited with $rc"
            tail -60 build-sim.log
            exit "$rc"
          fi
          tail -20 build-sim.log

      # The only place the replay layer is executed rather than compiled.
      # The app runs nvngfx_metal_selftest() at launch when BOTW_SELFTEST=1
      # and exits with its return code, so this asserts on a marker line and
      # on the process exit status.  (An XCTest bundle was tried first; on
      # this runner it reported "Executed 0 tests" with no reason, and a
      # plain simctl launch has no test-host requirement to satisfy.)
      - name: Run the replay-layer self-test in the simulator
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin)['devices']; w=[(rt,x['udid']) for rt,v in d.items() for x in v if x['name'].startswith('iPhone')]; print(w[-1][1] if w else '')")
          if [ -z "$UDID" ]; then
            xcrun simctl list devices available
            echo "::error::no iPhone simulator found"
            exit 1
          fi
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          APP=build/Build/Products/Debug-iphonesimulator/BotW.app
          # The tenth draw loads MSL through the bundle path, so the app has to
          # carry one.  These files are our own synthetic fixture; a real
          # translation set would be dropped into the same directory.
          rm -rf "$APP/shaders"
          cp -R nvn/shaders "$APP/shaders"
          ATTEMPT=1
          while :; do
            xcrun simctl install "$UDID" "$APP"
            DATA=$(xcrun simctl get_app_container "$UDID" dev.botw.app data)
            echo "container: $DATA (attempt $ATTEMPT)"
            rm -f "$DATA/Documents/selftest.txt" 2>/dev/null || true
            # stdout is attached after launch and the hook exits immediately, so
            # the result is written to Documents/selftest.txt as well.
            # --console attaches the app's stdout/stderr, which is where the
            # [nvn] diagnostics go.  Without it a failed pixel check says
            # only "rc=2048" and the reason is lost with the process.
            set +e
            # The fixture is part of this check: a missing bundle must fail the
            # job instead of turning draw 10 into a silent skip.
            SIMCTL_CHILD_BOTW_REQUIRE_SHADER_BUNDLE=1 \
            xcrun simctl launch --console --terminate-running-process \
              "$UDID" dev.botw.app --selftest > "/tmp/selftest-console.$ATTEMPT.log" 2>&1 &
            LAUNCH_PID=$!
            # A hung GPU command buffer used to leave the workflow blocked until
            # the job timeout, with the diagnostics still inside the simulator.
            # Kill the launch after 150 s so the log dump below always runs.
            for _ in $(seq 1 150); do
              if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$LAUNCH_PID" 2>/dev/null; then
              echo "::warning::self-test did not finish within 150 s (attempt $ATTEMPT)"
              kill "$LAUNCH_PID" 2>/dev/null || true
              xcrun simctl terminate "$UDID" dev.botw.app 2>/dev/null || true
              wait "$LAUNCH_PID" 2>/dev/null
              LAUNCH_RC=124
            else
              wait "$LAUNCH_PID"
              LAUNCH_RC=$?
            fi
            sleep 1
            set -e
            # A crash inside the app can still leave simctl with status 0, so
            # this number is context only: the rc marker in selftest.txt is what
            # decides pass/fail.
            echo "launch exit status: $LAUNCH_RC (not authoritative, attempt $ATTEMPT)"
            tail -20 "/tmp/selftest-console.$ATTEMPT.log" 2>/dev/null || true
            if [ -f "$DATA/Documents/selftest.txt" ] && \
               grep -q "BOTW_SELFTEST rc=" "$DATA/Documents/selftest.txt"; then
              break
            fi
            if [ "$ATTEMPT" -ge 2 ]; then break; fi
            # The first launch after a fresh boot occasionally never reaches
            # main(): no stdout, no selftest.txt, and simctl just sits there.
            # That is the simulator, not the replay layer -- a real hang
            # reproduces on the second attempt too.
            echo "::warning::the app wrote no selftest.txt on attempt $ATTEMPT; reinstalling and retrying"
            ATTEMPT=$((ATTEMPT + 1))
            xcrun simctl uninstall "$UDID" dev.botw.app 2>/dev/null || true
            sleep 3
          done
          cp "/tmp/selftest-console.$ATTEMPT.log" /tmp/selftest-console.log 2>/dev/null || true
          cat "$DATA/Documents/selftest.txt" 2>/dev/null || echo "(no selftest.txt)"
          if ! grep -q "BOTW_SELFTEST rc=0" "$DATA/Documents/selftest.txt" 2>/dev/null; then
            echo "::error::self-test did not report rc=0"
            # The rc is the only clue when the body of the run is lost, and
            # the run's raw log needs a token to read.  Annotations do not.
            cat "$DATA/Documents/selftest.txt" 2>/dev/null \
              | while IFS= read -r l; do echo "::error::selftest| $l"; done
            # Keep every selftest diagnostic.  The app's Metal validation
            # output can push the failing pixel line out of a short tail.
            grep -E '\[selftest\]|BOTW_SELFTEST' /tmp/selftest-console.log 2>/dev/null \
              | tail -80 | while IFS= read -r l; do echo "::error::console| $l"; done
            ls -la "$DATA/Documents" 2>/dev/null | while IFS= read -r l; do echo "::error::$l"; done
            # "No selftest.txt at all" is a different failure from a wrong
            # pixel: it means the process never reached main().  These two
            # lines say whether the simulator even has the app running.
            ps -Ao pid,etime,command 2>/dev/null | grep -i botw | grep -v grep | head -5 \
              | while IFS= read -r l; do echo "::error::ps| $l"; done
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i botw | head -5 \
              | while IFS= read -r l; do echo "::error::launchd| $l"; done
            xcrun simctl spawn "$UDID" log show --style compact --last 2m \
              --predicate 'process == "BotW"' 2>/dev/null | tail -40 \
              | while IFS= read -r l; do echo "::error::log| $l"; done
            # A signal (which a bad guest pointer produces) leaves no line in
            # the app's own output.  The simulator writes a report next to the
            # host's DiagnosticReports; its first frames name the faulting
            # instruction, so print the newest few instead of guessing.
            ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -4 \
              | while IFS= read -r r; do
                  echo "::error::crash| ===== $r ====="
                  head -60 "$HOME/Library/Logs/DiagnosticReports/$r" 2>/dev/null \
                    | while IFS= read -r l; do echo "::error::crash| $l"; done
                done
            exit 1
          fi
          echo "replay-layer self-test: draws encoded, pixels read back, rc=0"

      # Debug on purpose: nvn_metal.mm refuses an NDEBUG build while the NVN
      # enum values are unverified, so a Release build here would always fail.
      - name: Build for device (unsigned, Debug)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BotW.xcodeproj -scheme BotW \
            -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > build-dev.log 2>&1 || rc=$?
          if [ -n "${rc:-}" ]; then
            grep -E "(error|fatal error):" build-dev.log | head -25 | while read -r line; do
              echo "::error::$line"
            done
            tail -60 build-dev.log
            exit "$rc"
          fi
          tail -20 build-dev.log

      # The release gate is enforced by the compiler, not by a script that
      # someone can forget to run.  Assert it actually fires.
      - name: Release build must be refused
        working-directory: ios
        run: |
          set -o pipefail
          if xcodebuild -project BotW.xcodeproj -scheme BotW \
               -configuration Release -sdk iphoneos \
               -destination 'generic/platform=iOS' \
               -derivedDataPath build-release \
               CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
               build > build-release.log 2>&1; then
            echo "::error::Release build succeeded but NVN enums are unverified"
            tail -40 build-release.log
            exit 1
          fi
          if ! grep -q "Release build refused" build-release.log; then
            echo "::error::Release build failed for the wrong reason"
            grep -E "error:" build-release.log | head -20
            tail -40 build-release.log
            exit 1
          fi
          echo "release gate correctly refuses to compile"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: BotW-simulator-app
          path: ios/build/Build/Products/Debug-iphonesimulator/BotW.app
          if-no-files-found: warn
          retention-days: 14
