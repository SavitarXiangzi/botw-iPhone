name: ios-build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  core-syntax:
    # Fast gate: the C ABI must compile with a plain clang before we pay for a macOS runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++ core (host clang)
        run: clang++ -std=c++20 -Wall -Wextra -Werror -c core/src/botw_core.cpp -Icore/include -o /tmp/botw_core.o

  ios:
    needs: core-syntax
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify generated project parses
        working-directory: ios
        run: |
          xcodegen --version
          echo "objectVersion: $(grep -m1 objectVersion BotW.xcodeproj/project.pbxproj || echo missing)"
          plutil -lint BotW.xcodeproj/project.pbxproj || true
          if ! xcodebuild -list -project BotW.xcodeproj; then
            echo "::error::generated project cannot be opened by xcodebuild"
            exit 1
          fi

      - name: Build for iOS Simulator
        id: sim
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BotW.xcodeproj -scheme BotW \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build-sim.log 2>&1 || rc=$?
          if [ -n "${rc:-}" ]; then
            # surface the compiler errors as annotations so they are readable without log auth
            grep -E "(error|fatal error):" build-sim.log | head -15 | while read -r line; do
              echo "::error::$line"
            done
            echo "::error::xcodebuild exited with $rc"
            tail -60 build-sim.log
            exit "$rc"
          fi
          tail -20 build-sim.log

      - name: Build for device (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BotW.xcodeproj -scheme BotW \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > build-dev.log 2>&1 || rc=$?
          if [ -n "${rc:-}" ]; then
            grep -E "(error|fatal error):" build-dev.log | head -15 | while read -r line; do
              echo "::error::$line"
            done
            tail -60 build-dev.log
            exit "$rc"
          fi
          tail -20 build-dev.log

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: BotW-simulator-app
          path: ios/build/Build/Products/Debug-iphonesimulator/BotW.app
          if-no-files-found: warn
          retention-days: 14
